[project]
name = "a2fp-agent"
version = "0.1.0"
description = "Module 1: user query -> FloorGraph. Multi-role agent with per-role LoRA adapters."
requires-python = ">=3.12"
# LAYERING RULE: the runtime talks to vLLM over HTTP and must never pull torch.
# Everything GPU-shaped lives in lora_finetuning/ behind the [train] extra.
# CI asserts this — see .github/workflows/agent.yml.
dependencies = ["a2fp-contract", "httpx", "openai", "anthropic", "hydra-core"]

[project.optional-dependencies]
train = ["torch", "transformers", "trl", "peft", "datasets", "accelerate", "wandb"]

[project.scripts]
a2fp-agent = "a2fp_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
a2fp-contract = { path = "../contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the runtime ships. lora_finetuning/ is run in place, never imported by it.
packages = ["src/a2fp_agent"]

[tool.ruff]
line-length = 100
