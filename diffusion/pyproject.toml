[project]
name = "a2fp-diffusion"
version = "0.1.0"
description = "Module 2: FloorGraph -> FloorPlan corner polygons. Diffusion, trained from scratch."
requires-python = ">=3.12"
dependencies = ["a2fp-contract", "torch", "einops", "numpy", "hydra-core", "wandb"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
a2fp-contract = { path = "../contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2fp_diffusion"]
