[project]
name = "a2fp-contract"
version = "0.1.0"
description = "FloorGraph / FloorPlan contract shared by the agent and diffusion projects."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

# HARD RULE: this package is pydantic-only.
# No torch, no LLM SDK, no shapely. `just check-layering` asserts it.

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2fp_contract"]

[tool.ruff]
line-length = 100
